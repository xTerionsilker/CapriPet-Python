line-length = 75
target-version = "py310"

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RET",
    "YTT",
    "D100",
    "D101",
]
ignore = [
    "E501",
    "N802",
    "SIM108",
    "D203",
    "D212",
]
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[lint.per-file-ignores]
"tests/*" = ["D"]
