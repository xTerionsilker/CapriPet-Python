name: Lint, Test & Code Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Linter & PEP 8 Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Bytecode Syntax Verification
        run: |
          python -m compileall capri main.py

  test:
    name: Unit Tests, Mypy & Coverage
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy coverage

      - name: Run Static Type Verification (Mypy)
        run: |
          mypy capri

      - name: Run Unit Tests with Coverage
        run: |
          coverage run -m unittest discover -s tests

      - name: Display Coverage Report
        run: |
          coverage report
